server {
    listen 8080;
    
    location / {
        root /data;
        
        # CORS headers required for PMTiles to work
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, Range, X-Requested-With, Content-Type, Accept';
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Length, Accept-Ranges';
        
        # Support for byte-range requests (essential for PMTiles)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Range, X-Requested-With, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
